# Database - File-based H2 (persistent storage)
spring.datasource.url=jdbc:h2:file:./data/finance_manager_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# App port
server.port=8081

#JWT
jwt.secret=${JWT_SECRET:your-secret-key-here-change-in-production}
jwt.expiration=86400000

# CORS — add your production frontend URL here (comma-separated)
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:4173,http://localhost:3000

# Gemini AI — New Auth Key (AQ. prefix) format from Google AI Studio
# These keys MUST be sent via the x-goog-api-key header, NOT the ?key= query param
# Get your key at: https://aistudio.google.com/app/apikey
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api.model=gemini-3.6-flash
gemini.api.max-tokens=1000